services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Application\League\LeagueSourceInterface: '@App\Infrastructure\Services\LeagueSource\RapidLeagueSource'

    App\Infrastructure\Services\LeagueSource\LeagueSourceRegistry:
        arguments:
            $sources: !tagged_iterator { tag: 'app.league_source', index_by: 'source' }

    App\Infrastructure\Services\LeagueSource\RapidLeagueSource:
        tags:
            - { name: 'app.league_source', source: 'rapid' }
